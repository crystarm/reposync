name: Sync fork default branches

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only list the forks that would be synchronized
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: sync-fork-default-branches
  cancel-in-progress: false

jobs:
  sync:
    name: Synchronize forks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Synchronize default branches
        env:
          FORK_SYNC_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
          SYNC_OWNER: ${{ github.repository_owner }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: python3 scripts/sync_forks.py

      - name: Commit synchronization status
        if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true) }}
        run: |
          if git diff --quiet -- STATUS.md; then
            echo "STATUS.md is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STATUS.md
          git commit -m "chore: update synchronization status"
          git push
